<div class="modal-overlay" id="settingsModal" style="display:none;">
  <div class="modal modal-settings">
    <div class="modal-header">
      <h3>Paramètres</h3>
      <button class="modal-close" id="closeSettings">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">

      <!-- Modèle -->
      <div class="settings-section">
        <h4>Modèle</h4>
        <div class="settings-model-row">
          <select id="modelSelect">
            <option value="">Chargement…</option>
          </select>
          <button class="btn-sm" id="btnRefreshModels">Rafraîchir</button>
          <button class="btn-sm" id="btnModelInfo">Infos</button>
        </div>
      </div>

      <!-- System prompt -->
      <div class="settings-section">
        <h4>System prompt</h4>
        <textarea id="systemPrompt" rows="4"
                  placeholder="Ex : Tu es un assistant expert en programmation…"></textarea>
      </div>

      <!-- Température -->
      <div class="settings-section">
        <h4>Température : <span id="tempValue">0.7</span></h4>
        <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
        <div class="range-labels">
          <span>Précis</span>
          <span>Créatif</span>
        </div>
      </div>

      <!-- Couleur d'accent -->
      <div class="settings-section">
        <h4>Couleur d'accent</h4>
        <div class="color-swatches" id="colorSwatches">
          <button class="color-swatch active" data-color="#8b5cf6"
                  style="background:#8b5cf6;" title="Violet"></button>
          <button class="color-swatch" data-color="#3b82f6"
                  style="background:#3b82f6;" title="Bleu"></button>
          <button class="color-swatch" data-color="#10b981"
                  style="background:#10b981;" title="Vert"></button>
          <button class="color-swatch" data-color="#f59e0b"
                  style="background:#f59e0b;" title="Ambre"></button>
          <button class="color-swatch" data-color="#ef4444"
                  style="background:#ef4444;" title="Rouge"></button>
          <button class="color-swatch" data-color="#ec4899"
                  style="background:#ec4899;" title="Rose"></button>
          <button class="color-swatch" data-color="#06b6d4"
                  style="background:#06b6d4;" title="Cyan"></button>
        </div>
      </div>

      <!-- Liens -->
      <div class="settings-section">
        <h4>Liens</h4>
        <div class="settings-links">
          <a href="https://ollama.com" target="_blank" rel="noopener noreferrer">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10
                    15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            Ollama.com
          </a>
          <a href="https://ollama.com/library" target="_blank" rel="noopener noreferrer">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
            </svg>
            Bibliothèque de modèles
          </a>
        </div>
      </div>

    </div>
  </div>
</div>
