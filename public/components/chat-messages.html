<div class="chat-messages" id="chatMessages">
  <div class="welcome-screen" id="welcomeScreen">
    <svg class="welcome-logo" xmlns="http://www.w3.org/2000/svg" width="64" height="64"
         viewBox="0 0 24 24" fill="none" stroke="var(--accent)"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77
                       5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </svg>
    <h2>Bienvenue sur Ollama Chat</h2>
    <p>Commencez une conversation avec vos modèles locaux</p>
    <div class="suggestions">
      <button class="suggestion-chip"
              data-prompt="Explique-moi le fonctionnement des réseaux de neurones">
        Réseaux de neurones
      </button>
      <button class="suggestion-chip"
              data-prompt="Écris-moi une fonction Python de tri rapide avec des commentaires">
        Code Python
      </button>
      <button class="suggestion-chip"
              data-prompt="Quels sont les principes SOLID en programmation ?">
        Principes SOLID
      </button>
      <button class="suggestion-chip"
              data-prompt="Résume-moi les avantages de Docker pour le développement">
        Docker
      </button>
    </div>
  </div>
</div>
