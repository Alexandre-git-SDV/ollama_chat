<header class="chat-header">
  <div class="header-left">
    <button class="btn-icon" id="btnSidebarToggle" title="Menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="15" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <h1 class="header-title" id="headerTitle">Nouvelle conversation</h1>
  </div>

  <!-- Sélecteur modèle -->
  <div class="model-selector-wrapper">
    <button class="btn-model-select" id="btnModelSelect">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8V4H8"/>
        <rect x="2" y="8" width="20" height="12" rx="2"/>
        <path d="M6 12h.01"/>
        <path d="M18 12h.01"/>
        <path d="M9 16h6"/>
      </svg>
      <span id="modelName">Chargement…</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>
    <div class="model-dropdown" id="modelDropdown"></div>
  </div>

  <!-- Actions -->
  <div class="header-actions">
    <button class="btn-icon" id="btnExport" title="Exporter">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
    <button class="btn-icon" id="btnDeleteChat" title="Supprimer">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1
              2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
    </button>
  </div>
</header>
