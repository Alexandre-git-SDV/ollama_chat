<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama Chat</title>
  <link rel="stylesheet" href="style.css">

  <!-- Marked (Markdown) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

  <!-- highlight.js -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/styles/github-dark.min.css"
        id="hljs-theme-dark">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/styles/github.min.css"
        id="hljs-theme-light"
        disabled>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/highlight.min.js"></script>
</head>
<body>

  <div class="app" id="app">

    <!-- Sidebar -->
    <div id="sidebar-slot"></div>

    <!-- Backdrop mobile -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main -->
    <main class="main-area">
      <div id="chat-header-slot"></div>
      <div id="chat-messages-slot"></div>

      <!-- Typing indicator -->
      <div class="typing-indicator" id="typingIndicator" style="display:none;">
        <div class="typing-dots"><span></span><span></span><span></span></div>
        <span>Réflexion en cours…</span>
      </div>

      <div id="chat-input-slot"></div>
    </main>
  </div>

  <!-- Modals -->
  <div id="modal-settings-slot"></div>
  <div id="modal-model-info-slot"></div>

  <!-- Toast -->
  <div id="toast-slot"></div>

  <!-- Bootstrap : charge les composants HTML puis lance l'app -->
  <script src="js/bootstrap.js" type="module"></script>
</body>
</html>
