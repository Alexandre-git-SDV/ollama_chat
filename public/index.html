<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama Chat</title>
  <link rel="stylesheet" href="style.css">

  <!-- Marked (Markdown) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

  <!-- highlight.js (coloration syntaxique) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/styles/github-dark.min.css"
        id="hljs-theme-dark">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/styles/github.min.css"
        id="hljs-theme-light"
        disabled>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/highlight.min.js"></script>

  <!-- Langages highlight.js courants -->
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/languages/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/languages/typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/languages/java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/languages/bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/languages/json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/languages/sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/languages/xml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/languages/css.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/languages/go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/languages/rust.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/languages/cpp.min.js"></script>
</head>
<body>

  <div class="app" id="app">

    <!-- ═══════ SIDEBAR ═══════ -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-top">
        <button class="btn-new-chat" id="btnNewChat" title="Nouvelle conversation">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            <line x1="12" y1="7" x2="12" y2="13"/>
            <line x1="9" y1="10" x2="15" y2="10"/>
          </svg>
          <span>Nouvelle discussion</span>
        </button>
      </div>

      <!-- Liste conversations -->
      <nav class="conversations-nav" id="conversationsNav">
        <div class="conv-loading">Chargement…</div>
      </nav>

      <!-- Bas de sidebar -->
      <div class="sidebar-bottom">
        <button class="btn-theme-toggle" id="btnTheme" title="Changer de thème">
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <span class="theme-label">Thème</span>
        </button>
      </div>

    </aside>

    <!-- ═══════ ZONE PRINCIPALE ═══════ -->
    <main class="main" id="main">

      <!-- Header -->
      <header class="main-header">
        <button class="btn-sidebar-toggle" id="btnSidebarToggle">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>

        <h1 class="header-title" id="headerTitle">Ollama Chat</h1>

        <!-- Sélecteur de modèle -->
        <button class="btn-model-select" id="btnModelSelect">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 8V4H8"/>
            <rect x="2" y="8" width="20" height="12" rx="2"/>
            <path d="M6 12h.01"/>
            <path d="M18 12h.01"/>
            <path d="M9 16h6"/>
          </svg>
          <span id="modelName">Chargement…</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
      </header>

      <!-- Messages -->
      <section class="messages-container" id="messagesContainer">
        <div class="welcome" id="welcomeScreen">
          <div class="welcome-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
              <path d="M5 3v4"/>
              <path d="M19 17v4"/>
              <path d="M3 5h4"/>
              <path d="M17 19h4"/>
            </svg>
          </div>
          <h2>Comment puis-je vous aider ?</h2>
          <p>Posez une question ou démarrez une conversation avec votre modèle local.</p>
        </div>
      </section>

      <!-- Zone de saisie -->
      <div class="input-area" id="inputArea">
        <div class="input-wrapper">
          <textarea
            id="userInput"
            placeholder="Envoyer un message…"
            rows="1"
            autocomplete="off"
          ></textarea>
          <button class="btn-send" id="btnSend" disabled title="Envoyer">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
          <button class="btn-stop hidden" id="btnStop" title="Arrêter la génération">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                 viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <rect x="4" y="4" width="16" height="16" rx="2"/>
            </svg>
          </button>
        </div>
        <p class="input-disclaimer">
          Les réponses sont générées localement par Ollama. Aucune donnée n'est envoyée en ligne.
        </p>
      </div>

    </main>

  </div>

  <!-- ═══════ MODAL SÉLECTION MODÈLE ═══════ -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modalModels">
      <div class="modal-header">
        <h2>Choisir un modèle</h2>
        <button class="btn-modal-close" id="btnModalClose">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody">
        <div class="modal-loading">Recherche des modèles…</div>
      </div>
    </div>
  </div>

  <!-- ═══════ TOAST NOTIFICATIONS ═══════ -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>
